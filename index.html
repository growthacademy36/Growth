<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<title>Growth Academy – Learn. Grow. Succeed.</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* === RESET + FORCE LIGHT === */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { background:#fff !important; color-scheme:light; scroll-behavior:smooth; }
body { background:#fff !important; color:#0d2d6b; font-family:'Poppins',sans-serif; overflow-x:hidden; }

/* === VARS === */
:root {
  --navy: #0d2d6b;
  --blue: #1a4baa;
  --orange: #f97316;
  --bg: #ffffff;
  --bg2: #f4f7ff;
  --bg3: #fff7f0;
  --border: #e2e8f0;
  --sub: #536087;
}

/* === NAVBAR === */
#navbar {
  position: fixed; top:0; left:0; right:0; z-index:999;
  background: #ffffff !important;
  border-bottom: 2.5px solid #f97316;
  box-shadow: 0 2px 18px rgba(13,45,107,.1);
  display: flex; align-items:center; justify-content:space-between;
  padding: 10px 5%;
}
.nav-left { display:flex; align-items:center; gap:10px; }
.nav-left img { height:52px; width:52px; object-fit:contain; }
.nav-brand { font-family:'Montserrat',sans-serif; font-size:1.35rem; font-weight:900; color:#0d2d6b; line-height:1; }
.nav-brand span { color:#f97316; }

.nav-links { display:flex; align-items:center; gap:24px; list-style:none; }
.nav-links a { color:#0d2d6b; text-decoration:none; font-weight:600; font-size:.88rem; position:relative; transition:color .2s; }
.nav-links a:hover { color:#f97316; }
.nav-links a::after { content:''; position:absolute; bottom:-3px; left:0; width:0; height:2px; background:#f97316; transition:width .3s; }
.nav-links a:hover::after { width:100%; }
.nav-btn { background:linear-gradient(135deg,#f97316,#e05a00); color:#fff !important; padding:9px 20px; border-radius:25px; font-weight:700 !important; }
.nav-btn::after { display:none !important; }

.ham { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:4px; }
.ham span { width:25px; height:2.5px; background:#0d2d6b; border-radius:3px; transition:all .3s; display:block; }
.ham.open span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
.ham.open span:nth-child(2) { opacity:0; }
.ham.open span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }

#mob-menu {
  display:none; position:fixed; top:75px; left:0; right:0; z-index:998;
  background:#ffffff !important;
  border-bottom:3px solid #f97316;
  box-shadow:0 6px 24px rgba(13,45,107,.12);
  flex-direction:column; padding:10px 5%;
}
#mob-menu.open { display:flex; }
#mob-menu a { color:#0d2d6b; text-decoration:none; font-weight:600; font-size:.95rem; padding:12px 0; border-bottom:1px solid #e8edf8; display:block; transition:color .2s,padding .2s; }
#mob-menu a:last-child { border:none; }
#mob-menu a:hover { color:#f97316; padding-left:8px; }

/* === HERO === */
#hero {
  background:#ffffff !important;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding:110px 5% 70px;
  position:relative; overflow:hidden;
}
#hero::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 5% 80%, rgba(249,115,22,.07) 0%, transparent 100%),
    radial-gradient(ellipse 50% 40% at 95% 10%, rgba(26,75,170,.07) 0%, transparent 100%);
}
.hero-inner { position:relative; z-index:1; max-width:860px; }
.hero-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(249,115,22,.08); border:1.5px solid rgba(249,115,22,.3);
  color:#f97316; padding:7px 18px; border-radius:30px;
  font-size:.78rem; font-weight:700; letter-spacing:1.2px; margin-bottom:22px;
  animation: up .6s ease both;
}
#hero h1 {
  font-family:'Montserrat',sans-serif;
  font-size:clamp(2.5rem,7vw,5rem);
  font-weight:900; line-height:1.06; margin-bottom:18px;
  color:#0d2d6b;
  animation: up .6s .1s ease both;
}
#hero h1 em { color:#f97316; font-style:normal; }
#hero p {
  font-size:1.05rem; color:#536087; max-width:580px; margin:0 auto 34px;
  line-height:1.75; animation: up .6s .2s ease both;
}
.hero-btns { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; animation: up .6s .3s ease both; }
.btn-orange {
  background:linear-gradient(135deg,#f97316,#e05a00);
  color:#fff; padding:14px 34px; border-radius:30px; font-weight:700;
  text-decoration:none; font-size:.95rem; transition:all .3s;
  box-shadow:0 6px 24px rgba(249,115,22,.35);
}
.btn-orange:hover { transform:translateY(-3px); box-shadow:0 10px 32px rgba(249,115,22,.5); }
.btn-navy {
  border:2.5px solid #0d2d6b; color:#0d2d6b; background:transparent;
  padding:14px 34px; border-radius:30px; font-weight:700;
  text-decoration:none; font-size:.95rem; transition:all .3s;
}
.btn-navy:hover { background:#0d2d6b; color:#fff; transform:translateY(-3px); }

.hero-stats { display:flex; gap:36px; justify-content:center; margin-top:54px; flex-wrap:wrap; animation: up .6s .4s ease both; }
.s-num { font-family:'Montserrat',sans-serif; font-size:2rem; font-weight:900; color:#f97316; }
.s-lbl { font-size:.72rem; color:#536087; letter-spacing:1.2px; text-transform:uppercase; margin-top:2px; }

@keyframes up { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:none; } }

/* === SECTIONS === */
section { padding:80px 5%; }
.bg-white { background:#ffffff !important; }
.bg-light { background:#f4f7ff !important; }
.bg-light2 { background:#fff7f0 !important; }

.tag {
  display:inline-block; background:rgba(249,115,22,.1); color:#f97316;
  border:1px solid rgba(249,115,22,.25); padding:5px 15px; border-radius:20px;
  font-size:.72rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px;
}
h2.title {
  font-family:'Montserrat',sans-serif; font-size:clamp(1.7rem,4vw,2.6rem);
  font-weight:900; color:#0d2d6b; line-height:1.15; margin-bottom:12px;
}
h2.title span { color:#f97316; }
.sub { color:#536087; font-size:.93rem; line-height:1.7; max-width:540px; }

/* === ABOUT === */
.about-grid { display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; }
.about-img {
  border-radius:20px; overflow:hidden;
  border:3px solid rgba(249,115,22,.2);
  box-shadow:0 16px 50px rgba(13,45,107,.12);
  background:#fff;
  display:flex; align-items:center; justify-content:center;
  aspect-ratio:1; padding:30px;
}
.about-img img { width:100%; object-fit:contain; }
.about-feats { display:flex; flex-direction:column; gap:16px; margin-top:28px; }
.feat { display:flex; align-items:flex-start; gap:13px; }
.feat-icon { width:42px; height:42px; border-radius:10px; background:rgba(249,115,22,.1); border:1px solid rgba(249,115,22,.2); display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
.feat h4 { font-size:.88rem; font-weight:700; color:#0d2d6b; margin-bottom:3px; }
.feat p { font-size:.78rem; color:#536087; }

/* === SERVICES === */
.grid-3 { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:20px; }
.card {
  background:#fff; border:1.5px solid #e2e8f0; border-radius:14px; padding:26px;
  transition:all .3s; position:relative; overflow:hidden;
  box-shadow:0 2px 12px rgba(13,45,107,.05);
}
.card::after {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,#f97316,#1a4baa);
  transform:scaleX(0); transform-origin:left; transition:transform .3s;
}
.card:hover { transform:translateY(-5px); border-color:rgba(249,115,22,.4); box-shadow:0 14px 40px rgba(13,45,107,.1); }
.card:hover::after { transform:scaleX(1); }
.c-icon { font-size:1.9rem; margin-bottom:12px; }
.c-name { font-family:'Montserrat',sans-serif; font-size:.95rem; font-weight:800; color:#0d2d6b; margin-bottom:7px; }
.c-desc { font-size:.79rem; color:#536087; line-height:1.6; }

/* === PRICING === */
.pricing-wrap { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:24px; max-width:700px; margin:0 auto; }
.p-card {
  background:#fff; border:2px solid #e2e8f0; border-radius:18px; padding:30px;
  transition:all .3s; position:relative;
  box-shadow:0 4px 18px rgba(13,45,107,.06);
}
.p-card:hover { transform:translateY(-5px); border-color:#f97316; }
.p-card.featured {
  background:linear-gradient(145deg,#0d2d6b,#1a4baa);
  border-color:#f97316;
  box-shadow:0 0 40px rgba(249,115,22,.2);
}
.p-badge {
  position:absolute; top:-13px; left:50%; transform:translateX(-50%);
  background:#f97316; color:#fff; padding:4px 16px; border-radius:20px;
  font-size:.7rem; font-weight:700; letter-spacing:1px; white-space:nowrap;
}
.p-label { font-size:.75rem; font-weight:700; color:#f97316; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px; }
.p-price { font-family:'Montserrat',sans-serif; font-size:2.6rem; font-weight:900; color:#0d2d6b; margin-bottom:4px; }
.p-card.featured .p-price { color:#fff; }
.p-price small { font-size:.95rem; color:#536087; font-weight:400; }
.p-card.featured .p-price small { color:rgba(255,255,255,.6); }
.p-sub { font-size:.79rem; color:#536087; margin-bottom:22px; }
.p-card.featured .p-sub { color:rgba(255,255,255,.6); }
.p-list { list-style:none; display:flex; flex-direction:column; gap:9px; margin-bottom:24px; }
.p-list li { font-size:.81rem; display:flex; align-items:center; gap:9px; color:#0d2d6b; }
.p-card.featured .p-list li { color:rgba(255,255,255,.85); }
.p-list li::before { content:"✓"; color:#f97316; font-weight:900; flex-shrink:0; }
.btn-enroll {
  display:block; text-align:center; padding:11px; border-radius:25px;
  border:2px solid #f97316; color:#f97316; background:transparent;
  font-weight:700; font-size:.86rem; text-decoration:none; transition:all .3s;
}
.btn-enroll:hover, .p-card.featured .btn-enroll { background:#f97316; color:#fff; }
.p-card.featured .btn-enroll:hover { background:#fff; color:#f97316; }

/* === WHY US === */
.why-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px; }
.w-card {
  background:#fff; border:1.5px solid #e2e8f0; border-radius:14px; padding:26px;
  text-align:center; transition:all .3s;
  box-shadow:0 2px 12px rgba(13,45,107,.04);
}
.w-card:hover { transform:translateY(-4px); border-color:#f97316; box-shadow:0 10px 30px rgba(249,115,22,.1); }
.w-icon { font-size:2.2rem; margin-bottom:12px; }
.w-card h4 { font-family:'Montserrat',sans-serif; font-size:.9rem; font-weight:800; color:#0d2d6b; margin-bottom:7px; }
.w-card p { font-size:.78rem; color:#536087; line-height:1.6; }

/* === CONTACT === */
.contact-wrap { display:grid; grid-template-columns:1fr 1.4fr; gap:50px; align-items:start; }
.c-info { display:flex; flex-direction:column; gap:14px; }
.c-item {
  display:flex; align-items:flex-start; gap:14px;
  background:#f4f7ff; border:1.5px solid #e2e8f0; border-radius:12px; padding:16px;
  transition:all .3s;
}
.c-item:hover { border-color:#f97316; transform:translateX(4px); }
.c-ico { width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg,#f97316,#e05a00); display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
.c-item h4 { font-size:.83rem; font-weight:700; color:#0d2d6b; margin-bottom:3px; }
.c-item a, .c-item p { font-size:.78rem; color:#536087; text-decoration:none; display:block; }
.c-item a:hover { color:#f97316; }

.soc-title { font-size:.72rem; font-weight:700; color:#f97316; letter-spacing:2px; text-transform:uppercase; margin:8px 0 12px; }
.soc-row { display:flex; gap:9px; flex-wrap:wrap; }
.soc-btn {
  display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:9px;
  text-decoration:none; font-size:.76rem; font-weight:700; transition:all .3s;
  border:1.5px solid #e2e8f0; color:#0d2d6b; background:#fff;
}
.soc-btn:hover { transform:translateY(-2px); }
.soc-fb { border-color:#1877f2; color:#1877f2; }
.soc-fb:hover { background:#1877f2; color:#fff; }
.soc-ig { border-color:#e1306c; color:#e1306c; }
.soc-ig:hover { background:#e1306c; color:#fff; }
.soc-tt { border-color:#333; color:#333; }
.soc-tt:hover { background:#333; color:#fff; }
.soc-wa { border-color:#25d366; color:#25d366; }
.soc-wa:hover { background:#25d366; color:#fff; }

.c-form { background:#f4f7ff; border:2px solid #e2e8f0; border-radius:18px; padding:32px; }
.c-form h3 { font-family:'Montserrat',sans-serif; font-size:1.35rem; font-weight:900; color:#0d2d6b; margin-bottom:5px; }
.c-form > p { font-size:.8rem; color:#536087; margin-bottom:24px; }
.f-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.f-grp { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.f-grp label { font-size:.76rem; font-weight:700; color:#0d2d6b; }
.f-grp input, .f-grp select, .f-grp textarea {
  background:#fff; border:1.5px solid #e2e8f0; border-radius:9px;
  padding:10px 14px; color:#0d2d6b; font-family:'Poppins',sans-serif;
  font-size:.84rem; outline:none; transition:border-color .2s;
}
.f-grp input:focus, .f-grp select:focus, .f-grp textarea:focus { border-color:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,.08); }
.f-grp textarea { resize:vertical; min-height:90px; }
.btn-submit {
  width:100%; padding:13px; border-radius:11px; border:none; cursor:pointer;
  background:linear-gradient(135deg,#f97316,#e05a00);
  color:#fff; font-weight:700; font-size:.92rem; font-family:'Poppins',sans-serif;
  transition:all .3s; box-shadow:0 5px 20px rgba(249,115,22,.3);
}
.btn-submit:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(249,115,22,.45); }

/* === FOOTER === */
footer {
  background:#0d2d6b !important;
  border-top:3px solid #f97316;
  padding:48px 5% 22px;
  color:#fff;
}
.ft-grid { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:36px; margin-bottom:36px; }
.ft-brand { font-family:'Montserrat',sans-serif; font-size:1.4rem; font-weight:900; color:#fff; margin-bottom:10px; }
.ft-brand span { color:#f97316; }
.ft-desc { font-size:.8rem; color:rgba(255,255,255,.5); line-height:1.7; }
.ft-col h5 { font-size:.76rem; font-weight:700; color:#f97316; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:14px; }
.ft-col ul { list-style:none; display:flex; flex-direction:column; gap:8px; }
.ft-col ul li a { font-size:.79rem; color:rgba(255,255,255,.45); text-decoration:none; transition:color .2s; }
.ft-col ul li a:hover { color:#f97316; }
.ft-bottom { border-top:1px solid rgba(255,255,255,.1); padding-top:18px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.ft-bottom p { font-size:.73rem; color:rgba(255,255,255,.3); }

/* === WA BUTTON === */
.wa-btn {
  position:fixed; bottom:82px; right:18px; z-index:999;
  width:46px; height:46px; border-radius:50%; background:#25d366;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 16px rgba(37,211,102,.4);
  text-decoration:none; transition:all .3s;
  animation:pulse 2.5s infinite;
}
.wa-btn:hover { transform:scale(1.1); box-shadow:0 6px 24px rgba(37,211,102,.6); }
.wa-btn svg { width:24px; height:24px; fill:#fff; }
@keyframes pulse { 0%,100%{box-shadow:0 4px 16px rgba(37,211,102,.4);}50%{box-shadow:0 4px 24px rgba(37,211,102,.7),0 0 0 5px rgba(37,211,102,.12);} }

/* === SCROLL TOP === */
#top-btn {
  position:fixed; bottom:26px; right:18px; z-index:999;
  width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(135deg,#1a4baa,#0d2d6b);
  color:#fff; font-size:1.1rem;
  box-shadow:0 4px 16px rgba(13,45,107,.3);
  display:none; align-items:center; justify-content:center; transition:all .3s;
}
#top-btn.show { display:flex; }
#top-btn:hover { transform:translateY(-2px); }

/* === REVEAL === */
.reveal { opacity:0; transform:translateY(24px); transition:opacity .6s ease,transform .6s ease; }
.reveal.on { opacity:1; transform:none; }

/* === RESPONSIVE === */
@media(max-width:900px){ .about-grid,.contact-wrap{ grid-template-columns:1fr; } .ft-grid{ grid-template-columns:1fr 1fr; } .f-row{ grid-template-columns:1fr; } }
@media(max-width:640px){ .nav-links{ display:none; } .ham{ display:flex; } .ft-grid{ grid-template-columns:1fr; } }
</style>
</head>
